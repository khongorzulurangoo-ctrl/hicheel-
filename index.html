
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>YesBook</title>

    <style>
        
        
/* =========================
   GENERAL RESET
========================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #fff0f5, #f0e6ff);
    color: #51445f;
    min-height: 100vh;
    padding: 50px 20px;
    text-align: center;
}

/* =========================
   HEADINGS
========================= */

h1 {
    color: #d63384;
    font-size: 48px;
    margin-bottom: 15px;
    text-shadow: 2px 2px 5px #f5c6df;
}

h2 {
    color: #e879a9;
    font-size: 36px;
    margin-bottom: 15px;
}

h3 {
    color: #b28bd9;
    font-size: 30px;
    margin-bottom: 15px;
}

h4 {
    color: #8e75b5;
    font-size: 25px;
    margin-bottom: 15px;
}

h5 {
    color: #756080;
    font-size: 20px;
    margin-bottom: 25px;
}

/* =========================
   PRE TEXT
========================= */

pre {
    display: inline-block;
    background: white;
    color: #b45b91;
    padding: 20px 50px;
    border-radius: 15px;
    font-size: 16px;
    line-height: 1.8;
    box-shadow: 0 5px 20px #d9c5e5;
    margin: 15px;
    max-width: 100%;
    overflow-x: auto;
}

/* =========================
   LINKS
========================= */

a {
    display: inline-block;
    color: #c44b91;
    text-decoration: none;
    font-weight: bold;
    font-size: 17px;
    margin: 20px 0;
    transition: 0.3s ease;
}

a:hover {
    color: #8b4bb5;
    text-decoration: underline;
    transform: scale(1.05);
}

/* =========================
   BUTTONS
========================= */

button {
    background: linear-gradient(135deg, #f48fb1, #b388eb);
    color: white;
    border: none;
    padding: 14px 30px;
    border-radius: 30px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 5px 15px #d8b4e2;
    transition: all 0.3s ease;
}

button:hover {
    transform: translateY(-4px);
    box-shadow: 0 8px 20px #c69bdc;
}

button:active {
    transform: scale(0.96);
}

/* =========================
   TABLET RESPONSIVE
   768px and below
========================= */

@media screen and (max-width: 768px) {

    body {
        padding: 35px 20px;
    }

    h1 {
        font-size: 38px;
    }

    h2 {
        font-size: 30px;
    }

    h3 {
        font-size: 26px;
    }

    h4 {
        font-size: 22px;
    }

    h5 {
        font-size: 18px;
    }

    pre {
        padding: 18px 30px;
        font-size: 15px;
    }

    button {
        padding: 13px 26px;
        font-size: 15px;
    }
}

/* =========================
   MOBILE RESPONSIVE
   480px and below
========================= */

@media screen and (max-width: 480px) {

    body {
        padding: 25px 12px;
    }

    h1 {
        font-size: 30px;
        margin-bottom: 12px;
    }

    h2 {
        font-size: 25px;
    }

    h3 {
        font-size: 22px;
    }

    h4 {
        font-size: 19px;
    }

    h5 {
        font-size: 16px;
    }

    pre {
        padding: 15px 25px;
        font-size: 13px;
        width: 100%;
    }

    a {
        font-size: 15px;
    }

    button {
        width: 100%;
        max-width: 280px;
        padding: 13px 20px;
        font-size: 14px;
    }
}

/* =========================
   SMALL MOBILE
   320px and below
========================= */

@media screen and (max-width: 320px) {

    body {
        padding: 20px 8px;
    }

    h1 {
        font-size: 25px;
    }

    h2 {
        font-size: 21px;
    }

    h3 {
        font-size: 19px;
    }

    h4 {
        font-size: 17px;
    }

    h5 {
        font-size: 15px;
    }

    pre {
        font-size: 12px;
        padding: 12px;
    }

    button {
        font-size: 13px;
        padding: 12px;
    }
}


    </style>
</head>

<body>

    <h1>Hello World</h1>
    <h2>Hello World</h2>
    <h3>Hello World</h3>
    <h4>Hello World</h4>
    <h5>Hello World</h5>

    <pre>
hi
hi
hi
    </pre>

    <br>

    <a href="https://www.facebook.com" target="_blank">
        Visit Facebook
    </a>

    <br><br>

    <button>
        This is my first button
    </button>

</body>
</html>
